<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew // Pushup Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">
        <div class="logo-icon">💪</div>
        <span>Pushup Counter</span>
      </div>
      <div class="header-controls">
        <button class="icon-btn" id="theme-toggle" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="stat-card" style="--accent-color: #3B82F6;">
      <div class="stat-label">Total Pushups — All Time</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>

    <div class="stat-card" style="--accent-color: #22C55E;">
      <div class="stat-label">Daily Pushups</div>
      <div class="stat-value" id="stat-today">—</div>
    </div>

    <div class="stat-card" style="--accent-color: #A855F7;">
      <div class="stat-label">Daily Pushups Streak</div>
      <div class="stat-value" id="stat-streak">—<span class="stat-unit">Day</span></div>
    </div>

    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-label">Daily Goal Progress</span>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-range">
        <span id="progress-range-start">0</span>
        <span id="progress-range-end">200</span>
      </div>
    </div>

    <div class="quote-card">
      <p class="quote-text" id="quote-text"></p>
      <span class="quote-author" id="quote-author"></span>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
